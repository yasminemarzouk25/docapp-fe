kind: pipeline
type: kubernetes
name: ci-pipeline

trigger:
  # event:
  #   - push
  #   - tag
  branch:
    - dev
  # tag:
  #   - v[0-9]+.[0-9]+.[0-9]+
  #   - v[0-9]+.[0-9]+.[0-9]+-rc*

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:


# SonarQube

- name: sonarqube
  image: sonarsource/sonar-scanner-cli
  environment:
    SONAR_TOKEN:
      from_secret: SONAR_TOKEN
    SONAR_HOST_URL:
      from_secret: SONAR_HOST_URL
  commands:
    - sonar-scanner


# Set Environment (DEV / STG / PRD)

- name: set-env
  image: node:18
  environment:
    DRONE_RELEASE_REPO_DEV:
      from_secret: DRONE_RELEASE_REPO_DEV
    DRONE_RELEASE_REPO_STG:
      from_secret: DRONE_RELEASE_REPO_STG
    DRONE_RELEASE_REPO_PRD:
      from_secret: DRONE_RELEASE_REPO_PRD

    DRONE_HELM_RELEASE_REPO:
      from_secret: DRONE_HELM_RELEASE_REPO

    DRONE_PROJECT_REPO_DEV:
      from_secret: DRONE_PROJECT_REPO_DEV
    DRONE_PROJECT_REPO_STG:
      from_secret: DRONE_PROJECT_REPO_STG
    DRONE_PROJECT_REPO_PRD:
      from_secret: DRONE_PROJECT_REPO_PRD

    DRONE_HELM_PROJECT_DEV:
      from_secret: DRONE_HELM_PROJECT_DEV
    DRONE_HELM_PROJECT_STG:
      from_secret: DRONE_HELM_PROJECT_STG
    DRONE_HELM_PROJECT_PRD:
      from_secret: DRONE_HELM_PROJECT_PRD

    DRONE_REGISTRY_NAME_DEV:
      from_secret: DRONE_REGISTRY_NAME_DEV
    DRONE_REGISTRY_NAME_STG:
      from_secret: DRONE_REGISTRY_NAME_STG
    DRONE_REGISTRY_NAME_PRD:
      from_secret: DRONE_REGISTRY_NAME_PRD

    DRONE_REGISTRY_DOMAIN:
      from_secret: DRONE_REGISTRY_DOMAIN
    DRONE_IMAGE_NAME:
      from_secret: DRONE_IMAGE_NAME

    ACR_USERNAME_DEV:
      from_secret: ACR_USERNAME_DEV
    ACR_PASSWORD_DEV:
      from_secret: ACR_PASSWORD_DEV
    ACR_USERNAME_STG:
      from_secret: ACR_USERNAME_STG
    ACR_PASSWORD_STG:
      from_secret: ACR_PASSWORD_STG
    ACR_USERNAME_PRD:
      from_secret: ACR_USERNAME_PRD
    ACR_PASSWORD_PRD:
      from_secret: ACR_PASSWORD_PRD

  commands:
    - |
      if [ "$DRONE_BRANCH" = "master" ]; then
        echo "environment=development" >> .outputs
        echo "environment_display=Dev" >> .outputs
        echo "release_repo=$DRONE_RELEASE_REPO_DEV" >> .outputs
        echo "kustomize_folder=$DRONE_PROJECT_REPO_DEV" >> .outputs
        echo "helm_folder=$DRONE_HELM_PROJECT_DEV" >> .outputs
        echo "acr_name=$DRONE_REGISTRY_NAME_DEV.$DRONE_REGISTRY_DOMAIN" >> .outputs
        echo "acr_username=$ACR_USERNAME_DEV" >> .outputs
        echo "acr_password=$ACR_PASSWORD_DEV" >> .outputs
        echo "docker_tag=$DRONE_REGISTRY_NAME_DEV.$DRONE_REGISTRY_DOMAIN/$DRONE_IMAGE_NAME:$DRONE_COMMIT_SHA" >> .outputs
        echo "helm_tag=$DRONE_COMMIT_SHA" >> .outputs
      elif echo "$DRONE_TAG" | grep -q '\-rc'; then
        echo "environment=staging" >> .outputs
        echo "environment_display=Staging" >> .outputs
        echo "release_repo=$DRONE_RELEASE_REPO_STG" >> .outputs
        echo "kustomize_folder=$DRONE_PROJECT_REPO_STG" >> .outputs
        echo "helm_folder=$DRONE_HELM_PROJECT_STG" >> .outputs
        echo "acr_name=$DRONE_REGISTRY_NAME_STG.$DRONE_REGISTRY_DOMAIN" >> .outputs
        echo "acr_username=$ACR_USERNAME_STG" >> .outputs
        echo "acr_password=$ACR_PASSWORD_STG" >> .outputs
        echo "docker_tag=$DRONE_REGISTRY_NAME_STG.$DRONE_REGISTRY_DOMAIN/$DRONE_IMAGE_NAME:$DRONE_TAG" >> .outputs
        echo "helm_tag=$DRONE_TAG" >> .outputs
      else
        echo "environment=production" >> .outputs
        echo "environment_display=Production" >> .outputs
        echo "release_repo=$DRONE_RELEASE_REPO_PRD" >> .outputs
        echo "kustomize_folder=$DRONE_PROJECT_REPO_PRD" >> .outputs
        echo "helm_folder=$DRONE_HELM_PROJECT_PRD" >> .outputs
        echo "acr_name=$DRONE_REGISTRY_NAME_PRD.$DRONE_REGISTRY_DOMAIN" >> .outputs
        echo "acr_username=$ACR_USERNAME_PRD" >> .outputs
        echo "acr_password=$ACR_PASSWORD_PRD" >> .outputs
        echo "docker_tag=$DRONE_REGISTRY_NAME_PRD.$DRONE_REGISTRY_DOMAIN/$DRONE_IMAGE_NAME:$DRONE_TAG" >> .outputs
        echo "helm_tag=$DRONE_TAG" >> .outputs
      fi


# Build & Push Docker Image

- name: docker-build-push
  image: docker:24
  volumes:
    - name: docker-sock
      path: /var/run/docker.sock
  commands:
    - export $(cat .outputs | xargs)
    - docker login $acr_name -u $acr_username -p $acr_password
    - docker build -t $docker_tag .
    - docker push $docker_tag


# Deployment Approval (PROD only)

- name: deployment-approval
  image: python:3.11
  when:
    event:
      - tag
  environment:
    EMAIL_USERNAME:
      from_secret: EMAIL_USERNAME
    EMAIL_PASSWORD:
      from_secret: EMAIL_PASSWORD
    APPROVERS:
      from_secret: APPROVERS
    APPROVERS_NAME:
      from_secret: APPROVERS_NAME
    PROJECT_ID:
      from_secret: PROJECT_ID
  commands:
    - pip install imapclient
    - python application-scripts/Pipelines/approval/approval-oneperson.py


# Kustomize Release

- name: kustomize-release
  image: k8s.gcr.io/kustomize/kustomize:v5.3.0
  environment:
    GITHUB_TOKEN:
      from_secret: GITHUBTOKEN
  commands:
    - export $(cat .outputs | xargs)
    - git clone https://x-access-token:$GITHUB_TOKEN@github.com/$release_repo.git repo
    - cd repo/$kustomize_folder
    - git config user.name "yasminemarzouk"
    - git config user.email "marzouk.yasmine@esprit.tn"
    - kustomize edit set image $docker_tag
    - git add .
    - git commit -m "Release $environment $docker_tag"
    - git push
